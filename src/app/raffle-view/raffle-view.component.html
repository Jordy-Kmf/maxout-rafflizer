<section class="text-gray-400 bg-gray-900 body-font ">
  <div class="container flex flex-col items-center justify-center flex-grow px-5 py-20 mx-auto">
    <div class="w-full text-center lg:w-2/3">
      <h1 class="mb-2 text-4xl font-medium text-white title-font sm:text-4xl">
        Welcome To MaxOut 2024 Raffle!!!
      </h1>

      <div class="flex justify-center gap-0 rounded-md shadow-sm bg-slate-900">
        <span *ngFor="let char of num"
          class="p y-4 text-[10rem] font-bold text-white w-44 relative justify-center overflow-hidden items-center">
          {{ char | uppercase }}
        </span>
      </div>
      <p class="mb-8 leading-relaxed">
        The long awaited MaxOut Raffle is here. Join the excitement and win prizes! <br>
        Sit back, relax and keep your fingers crossed 🤞🏼.
      </p>
      <div class="flex justify-center">
        <button
          class="inline-flex px-6 py-2 text-lg text-gray-400 bg-gray-800 border-0 rounded focus:outline-none hover:bg-gray-700 hover:text-white"
          (click)="showConfetti()">Confetti 🎉</button>
        <button
          class="inline-flex px-6 py-2 ml-4 text-lg text-white bg-yellow-500 border-0 rounded focus:outline-none hover:bg-yellow-600"
          (click)="startShuffle()" [disabled]="spinning || allCodes.length === 0"
          [pTooltip]="allCodes.length === 0 ? 'Upload unique codes before you can start the raffle' : spinning ? 'Please  wait for the current raffle to finish' : ''"
          tooltipPosition="right" showDelay="50" hideDelay="200">
          Start Raffle
        </button>
      </div>
    </div>
  </div>
</section>

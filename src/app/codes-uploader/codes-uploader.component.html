<p-sidebar [(visible)]="sidebarVisible" position="right" [dismissible]="false"
  styleClass="custom-sidebar bg-gray-900 p-0 w-4/5 lg:w-1/3 md:w-2/4" class="">
  <section class="text-gray-400 bg-gray-900 body-font h-dv">
    <div class="container flex flex-wrap items-center px-2 mx-auto">
      <h2 class="mb-5 text-xl font-medium text-white title-font">Upload Unique Codes</h2>
      <div class="flex flex-col w-full p-8 mt-10 bg-gray-800 bg-opacity-50 rounded-lg md:ml-auto md:mt-0">

        <div *ngIf="existingCodesCount > 0"
          class="flex items-center justify-between gap-3 p-3 mb-4 text-sm bg-yellow-900 border border-yellow-700 rounded bg-opacity-30">
          <span class="text-yellow-200">{{ existingCodesCount }} codes already loaded from your last session.</span>
          <button pButton type="button" label="Load into editor"
            class="px-3 py-1 text-xs text-yellow-200 bg-transparent border border-yellow-200 rounded hover:bg-yellow-800 hover:bg-opacity-30"
            (click)="useExistingCodes()"></button>
        </div>

        <div class="relative mb-4">
          <span class="text-sm leading-7 text-gray-400">Upload a .txt file</span>
          <label for="codes-file"
            class="flex items-center justify-center w-full px-3 py-5 text-sm text-center text-gray-300 transition-colors duration-200 ease-in-out border border-gray-600 border-dashed rounded cursor-pointer hover:border-yellow-500">
            {{ fileName || 'Choose file (one code per line)' }}
          </label>
          <input id="codes-file" type="file" accept=".txt" class="hidden" (change)="onFileSelected($event)">
        </div>

        <div class="mb-4 text-xs text-center text-gray-500">or paste below</div>

        <div class="relative mb-2">
          <label for="codes-input" class="text-sm leading-7 text-gray-400">Enter unique codes</label>
          <textarea [(ngModel)]="allCodes" id="codes-input" rows="5" cols="30"
            placeholder="Enter unique codes, one per line..."
            class="w-full px-3 py-1 text-base leading-8 text-gray-100 transition-colors duration-200 ease-in-out bg-gray-600 border border-gray-600 rounded outline-none bg-opacity-20 focus:bg-transparent focus:ring-2 focus:ring-yellow-900 focus:border-yellow-500"
            (input)="onTextareaChange()"></textarea>
        </div>

        <p class="mb-4 text-xs" *ngIf="allCodes">
          <span class="text-green-500">{{ uniqueCodesCount }} valid</span>
          <span *ngIf="invalidCodesCount > 0" class="text-red-400"> · {{ invalidCodesCount }} invalid (codes must be 6
            chars,
            A-Z/0-9)</span>
        </p>

        <button pButton type="button" label="Load {{ uniqueCodesCount }} codes"
          class="px-8 py-2 text-lg text-white bg-yellow-500 border-0 rounded focus:outline-none hover:bg-yellow-600"
          (click)="loadUniqueCodes()" [disabled]="!allCodes"></button>
      </div>
    </div>
  </section>
</p-sidebar>
